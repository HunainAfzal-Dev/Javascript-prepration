name: Daily Auto Commit

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  commit-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make daily change
        run: |
          echo "// Updated on $(date)" >> javascript-prepration/index.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add javascript-prepration/index.js
          git commit -m "Daily automated update" || echo "No changes"
          git push
